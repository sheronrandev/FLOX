name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Python for the FLOX generator
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Verify types, tests, and production build
        run: npm run verify

      - name: Verify the FLOX JSON generator
        run: |
          python skills/flox-json-generator/scripts/build_flox_batch.py \
            --spec skills/flox-json-generator/assets/batch-spec.template.json \
            --output "$RUNNER_TEMP/flox-skill-smoke"
          python skills/flox-json-generator/scripts/validate_flox_batch.py \
            "$RUNNER_TEMP/flox-skill-smoke" \
            --spec skills/flox-json-generator/assets/batch-spec.template.json
          node skills/flox-json-generator/scripts/validate_with_flox.mjs \
            "$RUNNER_TEMP/flox-skill-smoke" \
            "$GITHUB_WORKSPACE"
